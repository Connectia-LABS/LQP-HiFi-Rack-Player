name: Bug report
description: Report a reproducible problem in LQP HiFi Rack Player
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, personal media paths, or sensitive configuration.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "4.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove API keys, usernames, and private paths before posting.
      render: shell
